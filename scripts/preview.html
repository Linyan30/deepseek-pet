<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>截图渲染台</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      iframe {
        position: absolute;
        left: 0;
        top: 0;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <!--
      无头 Chrome 的窗口最小是 500x500，所以先渲染一个固定尺寸的 iframe，
      再按 iframe 的尺寸裁剪截图，这样页面内部的视口才是准确的。
    -->
    <iframe id="frame" width="200" height="250"></iframe>
    <script>
      const params = new URLSearchParams(window.location.search);
      const frame = document.getElementById('frame');
      const width = Number(params.get('w')) || 200;
      const height = Number(params.get('h')) || 250;
      frame.width = String(width);
      frame.height = String(height);
      frame.style.width = `${width}px`;
      frame.style.height = `${height}px`;
      if (params.get('src')) frame.src = params.get('src');
    </script>
  </body>
</html>
