<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'"
    />
    <title>和小鲸鱼聊天</title>
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <div class="card">
      <header class="titlebar">
        <img class="avatar" id="avatar" src="assets/avatar-girl.png" alt="" width="34" height="34" />
        <div class="titles">
          <strong id="pet-name">小深</strong>
          <span class="status" id="status">在线</span>
        </div>
        <span class="level-badge" id="level-badge" title="亲密度">❤️ Lv.1</span>
        <div class="tools">
          <button class="icon-btn" id="btn-web" type="button" title="联网搜索（开 / 关）">🌐</button>
          <button class="icon-btn" id="btn-command" type="button" title="快捷指令">⚡</button>
          <button class="icon-btn" id="btn-image" type="button" title="发送图片">🖼</button>
          <button class="icon-btn" id="btn-new" type="button" title="开始新对话">✚</button>
          <button class="icon-btn" id="btn-settings" type="button" title="设置">⚙</button>
          <button class="icon-btn" id="btn-close" type="button" title="关闭">✕</button>
        </div>
      </header>

      <div class="banner hidden" id="banner">
        <span id="banner-text"></span>
        <button class="banner-btn" id="banner-action" type="button">去设置</button>
      </div>

      <main class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="welcome-emoji">🐳</div>
          <p class="welcome-title">和小鲸鱼聊点什么？</p>
          <p class="welcome-sub">Enter 发送 · Shift + Enter 换行</p>
          <div class="chips" id="chips">
            <button class="chip" type="button" data-prompt="讲个冷笑话">讲个冷笑话</button>
            <button class="chip" type="button" data-prompt="帮我想三个变量名">起个变量名</button>
            <button class="chip" type="button" data-prompt="今天午饭吃什么好？">午饭吃什么</button>
            <button class="chip" type="button" data-prompt="用一个词形容我">形容一下我</button>
          </div>
        </div>
      </main>

      <div class="attach hidden" id="attach">
        <img id="attach-preview" alt="" />
        <div class="attach-meta">
          <strong id="attach-name">图片</strong>
          <span>随下一条消息一起发送</span>
        </div>
        <button class="attach-remove" id="attach-remove" type="button" title="移除图片">✕</button>
      </div>

      <div class="player hidden" id="player">
        <img class="player-cover" id="player-cover" alt="" />
        <div class="player-meta">
          <strong id="player-title">未在播放</strong>
          <span id="player-sub"></span>
          <div class="player-progress"><span id="player-bar"></span></div>
        </div>
        <button class="player-btn" id="player-toggle" type="button" title="播放 / 暂停">⏸</button>
        <button class="player-btn" id="player-stop" type="button" title="停止">✕</button>
      </div>

      <div class="palette hidden" id="palette">
        <div class="palette-head">
          <span>快捷指令</span>
          <span class="palette-hint">自动带上剪贴板内容</span>
        </div>
        <div class="palette-list" id="palette-list"></div>
      </div>

      <form class="composer" id="composer">
        <textarea
          id="input"
          rows="1"
          maxlength="4000"
          placeholder="和小鲸鱼说点什么…"
          aria-label="消息输入框"
        ></textarea>
        <button class="send" id="send" type="submit" title="发送" aria-label="发送">➤</button>
      </form>
    </div>

    <input type="file" id="image-input" accept="image/*" hidden />

    <script src="../shared/preview-api.js"></script>
    <script src="../shared/markdown.js"></script>
    <script src="../shared/format.js"></script>
    <script src="../shared/stickers.js"></script>
    <script src="../shared/commands.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
