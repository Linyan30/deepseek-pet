appId: com.deepseek.pet
productName: DeepSeekPet
copyright: Copyright © 2026 DeepSeek Pet Contributors

directories:
  output: release
  buildResources: build

files:
  - main.js
  - preload.js
  - src/**/*
  - package.json

asar: true
compression: maximum

# 自动更新元数据（latest.yml / latest-mac.yml / latest-linux.yml）的来源
publish:
  provider: github
  owner: Linyan30
  repo: deepseek-pet

win:
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64

portable:
  artifactName: DeepSeekPet-${version}-portable.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek 小鲸鱼
  artifactName: DeepSeekPet-${version}-setup.exe

mac:
  category: public.app-category.entertainment
  icon: build/icon.png
  # dmg 给用户手动安装，zip 给自动更新用（electron-updater 需要）
  artifactName: DeepSeekPet-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

linux:
  icon: build/icon.png
  category: Utility
  target:
    - target: AppImage
      arch:
        - x64

appImage:
  artifactName: DeepSeekPet-${version}-${arch}.${ext}
