name: Release

# 两种触发方式：
# 1. 推送 v 开头的 tag（例如 v1.0.0）—— 最标准；
# 2. 在 Actions 页面手动 Run workflow，填一个版本号 —— 不用命令行也能发版。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的版本标签，例如 v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 运行测试
        run: npm test

      - name: 打包
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # 没有签名证书时让 electron-builder 跳过签名，避免 macOS 构建失败
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 检查自动更新元数据
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            win) file=latest.yml ;;
            mac) file=latest-mac.yml ;;
            linux) file=latest-linux.yml ;;
          esac
          if [ ! -f "release/$file" ]; then
            echo "::error::缺少 $file，自动更新会失效"
            ls -la release || true
            exit 1
          fi
          echo "OK: $file"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-pet-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/latest*.yml
            release/*.blockmap

  release:
    name: 发布到 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          # tag 触发时用 tag 名；手动触发时用输入的版本号（GitHub 会自动创建这个 tag）
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: artifacts/**
          generate_release_notes: true
          draft: false
